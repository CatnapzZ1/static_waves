baseURL: https://catnapzz.site/
title: CatnapzZ's world
languageCode: zh-CN
defaultContentLanguage: zh
hasCJKLanguage: true
enableRobotsTXT: true
enableGitInfo: true
buildDrafts: false
buildFuture: false
buildExpired: false
pagination:
  pagerSize: 10
module:
  imports:
    - path: github.com/adityatelange/hugo-PaperMod
frontmatter:
  lastmod:
    - lastmod
    - :git
    - date
permalinks:
  posts: /posts/:slug/
taxonomies:
  category: categories
  tag: tags
outputs:
  home:
    - HTML
    - RSS
    - JSON
params:
  social:
    twitter: ""
    facebook_admin: ""
  description: waiting
  mainSections:
    - posts
  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: true
  ShowBreadCrumbs: true
  ShowPostNavLinks: true
  ShowCodeCopyButtons: true
  ShowToc: true
  UseHugoToc: true
  TocOpen: false
  ShowFullTextinRSS: true
  ShowShareButtons: false
  comments: false
  hideFooter: false
  footer:
    text: "[鲁ICP备2026058675号-1](https://beian.miit.gov.cn/)"
  disableScrollToTop: false
  homeInfoParams:
    Title: CatnapzZ
    Content: 这不是把一生献给谁的故事
  avatar: /images/site/avatar.webp
  avatarAlt: 个人头像
  label:
    text: CatnapzZ's world
    icon: /images/site/logo.png
    iconHeight: 40
  assets:
    disableHLJS: true
    favicon: /favicon.ico
    favicon16x16: /favicon-16x16.png
    favicon32x32: /favicon-32x32.png
    apple_touch_icon: /apple-touch-icon.png
    safari_pinned_tab: /safari-pinned-tab.svg
  cover:
    hidden: false
    hiddenInList: false
    hiddenInSingle: false
  socialIcons:
    - name: rss
      url: /index.xml
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 1
    keys:
      - title
      - summary
      - content
  cloudflareAnalyticsToken: ""
menu:
  main:
    - name: 首页
      url: /
      weight: 10
    - name: 文章
      url: /posts/
      weight: 20
    - name: 分类
      url: /categories/
      weight: 30
    - name: 标签
      url: /tags/
      weight: 40
    - name: 归档
      url: /archives/
      weight: 50
    - name: 搜索
      url: /search/
      weight: 60
    - name: 关于
      url: /about/
      weight: 70
markup:
  goldmark:
    renderer:
      unsafe: false
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - - \[
              - \]
            - - $$
              - $$
          inline:
            - - \(
              - \)
  highlight:
    noClasses: false
    lineNos: false
    guessSyntax: false
  tableOfContents:
    startLevel: 2
    endLevel: 3
    ordered: false

ignoreFiles: ["(?i)README\\.md$"]
