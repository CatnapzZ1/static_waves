# Enable ONLY after the certificate exists. Replace YOUR_DOMAIN everywhere.
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://YOUR_DOMAIN$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name YOUR_DOMAIN;
    ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:BLOG_TLS:10m;
    root /var/www/blog/current;
    index index.html;
    charset utf-8;
    server_tokens off;
    access_log /var/log/nginx/blog.access.log;
    error_log /var/log/nginx/blog.error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    # Enable HSTS only after HTTPS/renewal have been verified; no preload by default.
    # add_header Strict-Transport-Security "max-age=15552000" always;
    location ~ /\. { deny all; }
    location = /release-id.txt { expires -1; try_files $uri =404; }
    location ~* \.(css|js|mjs|png|jpe?g|gif|webp|svg|ico|woff2?)$ {
        expires 7d;
        try_files $uri =404;
    }
    location ~* \.(html|xml|json|txt)$ {
        expires -1;
        try_files $uri =404;
    }
    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
}
